[package]
name = "playerversus"
author = "danny"
version = "1.4.1"
description = "PLAYER VERSUS: a 3D arena fighter prototype (44 fighters, 1v1 and 2v2 modes, merging supers with their own themes, 70+ items and your own, a CPU opponent)"
main = "playerversus.fw"
exclude = [".cache/", ".loader", ".playerversus"]

[dependencies]
aperture = "polymorphia.aperture"
playerversus_music_menus = "danny.playerversus_music_menus"
playerversus_music_fights = "danny.playerversus_music_fights"
playerversus_music_supers_1 = "danny.playerversus_music_supers_1"
playerversus_music_supers_2 = "danny.playerversus_music_supers_2"
playerversus_music_supers_3 = "danny.playerversus_music_supers_3"
playerversus_music_supers_4 = "danny.playerversus_music_supers_4"
playerversus_music_supers_5 = "danny.playerversus_music_supers_5"
playerversus_music_supers_6 = "danny.playerversus_music_supers_6"

[dev-dependencies]

[scripts]
test = "flywheel --test"
start = "./play"

[commands]
playerversus = "loader.fw"